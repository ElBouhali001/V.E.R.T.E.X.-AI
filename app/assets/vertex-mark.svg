<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Vertex Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A8CFF"/>
      <stop offset="1" stop-color="#3D3BD6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.69" r="0.32">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <!-- two edges converging on one vertex -->
  <path d="M286 286 L512 704 L738 286" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sources -->
  <circle cx="286" cy="286" r="62" fill="#FFFFFF"/>
  <circle cx="738" cy="286" r="62" fill="#FFFFFF"/>
  <!-- the vertex -->
  <circle cx="512" cy="704" r="112" fill="#FFFFFF"/>
  <circle cx="512" cy="704" r="50" fill="#2A63F0"/>
</svg>

[project]
name = "vertex-hub"
version = "0.1.0"
description = "Vertex Hub: the intersection of PLM ontologies and agile delivery."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pandas>=2", "networkx>=3", "matplotlib>=3.7", "pydantic>=2"]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "jupyterlab>=4"]
llm = ["openai>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

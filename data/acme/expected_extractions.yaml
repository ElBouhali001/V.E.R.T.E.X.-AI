# Ground truth for the AI extraction step. Every quote must appear word for word in its document.
# The validator computes the impacted items from the graph and writes expected_results.json.
# kind: decision | proposal | constraint | fact | vocabulary | version_change
# status: confirmed (a decision taken) | proposed (needs a decision)
extractions:
  - id: X-01
    doc: DOC-01
    kind: constraint
    status: confirmed
    quote: "Jira remains the master tool for the backlog."
    affects: { system: SYS-JIRA }
  - id: X-02
    doc: DOC-01
    kind: vocabulary
    status: confirmed
    quote: "All three names will be treated as the same concept."
    affects: { concept: C-PBOM, aliases: [Plant BOM, PBOM, BOP] }
  - id: X-03
    doc: DOC-02
    kind: decision
    status: confirmed
    quote: "The part description in 3DEXPERIENCE (V_description) is confirmed at a maximum of 80 characters."
    affects: { attribute: ATT-DESC, system: SYS-PLM, property: max_length, value: 80 }
    expected_conflict: true
    risk: high
    why: SAP MAKTX is 40 characters; confirming 80 in PLM creates truncation on INT-01. Detectable on 21 Sept, two weeks before the ERP workshop raised it.
  - id: X-04
    doc: DOC-02
    kind: decision
    status: confirmed
    quote: "Mass is stored in kilograms with 3 decimals."
    affects: { attribute: ATT-WEIGHT, system: SYS-PLM, property: unit, value: kg }
    expected_conflict: false
  - id: X-05
    doc: DOC-03
    kind: proposal
    status: proposed
    quote: "L'équipe ERP propose de limiter la désignation article à 40 caractères côté PLM, plutôt que de tronquer à l'interface."
    affects: { attribute: ATT-DESC, system: SYS-PLM, property: max_length, value: 40 }
    expected_conflict: true
    risk: high
    why: PLM allows 80 today; DOC-02 confirmed 80; descriptions longer than 40 are truncated in SAP.
  - id: X-06
    doc: DOC-03
    kind: constraint
    status: confirmed
    quote: "Les codes poste de charge (ARBPL) sont sur 8 caractères maximum dans SAP."
    affects: { attribute: ATT-WORKCENTER, system: SYS-ERP, property: max_length, value: 8 }
    expected_conflict: true
    risk: medium
    why: PLM resource names allow 40 characters; explains the TC-405 failure reported in DOC-04.
  - id: X-07
    doc: DOC-04
    kind: decision
    status: proposed
    quote: "From PI-3, the ERP team will store the gross weight of fasteners in grams (GEWEI = G) instead of kilograms"
    affects: { attribute: ATT-WEIGHT, system: SYS-ERP, property: unit, value: g }
    expected_conflict: true
    risk: medium
    why: PLM sends kg (DOC-02); without unit conversion in INT-01, SAP values are wrong by a factor of 1000.
  - id: X-08
    doc: DOC-04
    kind: fact
    status: confirmed
    quote: "TC-405 failed: work center codes are rejected by MES."
    affects: { test_case: TC-405 }
  - id: X-09
    doc: DOC-05
    kind: version_change
    status: confirmed
    quote: "the PLM platform moves from 3DEXPERIENCE R2025x to R2026x at the start of PI-3."
    affects: { system: SYS-PLM, from_profile: 3dexperience_R2025x, to_profile: 3dexperience_R2026x }
    expected_conflict: true
    risk: medium
    why: profile diff changes ATT-DESC and ATT-OPLABEL lengths (illustrative); interfaces must be retested.
  - id: X-10
    doc: US-412
    kind: proposal
    status: proposed
    quote: "limited to 40 characters"
    affects: { attribute: ATT-OPLABEL, system: SYS-MES, property: max_length, value: 40 }
    expected_conflict: true
    risk: high
    why: PLM operation names allow 60 characters; PLM-to-MES tests TC-401 and TC-402 will fail on long labels.

  - id: X-11
    doc: DOC-03
    kind: constraint
    status: confirmed
    quote: "dans SAP le champ MAKTX est limité à 40 caractères."
    affects: { attribute: ATT-DESC, system: SYS-ERP, property: max_length, value: 40 }
    expected_conflict: true
    risk: high
    why: restates the SAP limit; PLM still allows 80, so INT-01 truncates.

  # ---- HOLDOUT: DOC-06 was written after the rule-based baseline, with paraphrases
  # (spelled-out numbers, plurals, synonyms) the rules were never tuned on.
  - id: X-12
    doc: DOC-06
    holdout: true
    kind: constraint
    status: confirmed
    quote: "SAP cannot hold a material short text beyond forty characters"
    affects: { attribute: ATT-DESC, system: SYS-ERP, property: max_length, value: 40 }
    expected_conflict: true
  - id: X-13
    doc: DOC-06
    holdout: true
    kind: constraint
    status: confirmed
    quote: "Côté MES, le code du poste ne doit pas dépasser huit caractères."
    affects: { attribute: ATT-WORKCENTER, system: SYS-MES, property: max_length, value: 8 }
    expected_conflict: true
  - id: X-14
    doc: DOC-06
    holdout: true
    kind: fact
    status: confirmed
    quote: "Operation names authored in 3DEXPERIENCE may run up to 60 characters."
    affects: { attribute: ATT-OPLABEL, system: SYS-PLM, property: max_length, value: 60 }
    expected_conflict: false
  - id: X-15
    doc: DOC-06
    holdout: true
    kind: proposal
    status: proposed
    quote: "planners want weights in SAP expressed in grams for every part"
    affects: { attribute: ATT-WEIGHT, system: SYS-ERP, property: unit, value: g }
    expected_conflict: true

